services:
  course-composer:
    build:
      context: .
      dockerfile: Dockerfile.courses
    volumes:
      - "./Modules:/app/Modules:ro"
      - "./Courses:/app/Courses:ro"

  marp:
    build:
      context: .
      dockerfile: Dockerfile
    image: modularmaterials-marp
    working_dir: /app
    volumes:
      - "./Scripts:/app/Scripts:ro"
      - "./Modules:/app/Modules:ro"
      - "./Courses:/app/Courses:ro"
      - "./Assets:/app/Assets:ro"
      - "./Theme:/app/Theme:ro"
      - "./build:/app/build"
      - "./output:/app/output"
    entrypoint: ["/opt/venv/bin/python", "Scripts/build_course.py"]
    command: ["Courses/shared-assets-demo.yaml", "--renderer", "local"]

  # Module Generator for create_module.py:
  module-generator:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - "./Scripts:/app/Scripts:ro"
      - "./Templates:/app/Templates:ro"
      - "./Modules:/app/Modules"
    entrypoint: ["python3"]
    command: ["Scripts/create_module.py"]
    stdin_open: true
    tty: true

  # Importer for existing module Markdown files:
  module-importer:
    build:
      context: .
      dockerfile: Dockerfile.courses
    entrypoint: ["python3", "Scripts/import_module.py"]
    volumes:
      - "./Modules:/app/Modules"
      - "./Import:/app/Import"
    stdin_open: true
    tty: true
