services:
  marp:
    build:
      context: .
      dockerfile: Dockerfile
    image: modularmaterials-marp
    working_dir: /app
    volumes:
      - "./Marp Vorlage von Rea/input:/app/input:ro"
      - "./Marp Vorlage von Rea/imgs:/app/imgs:ro"
      - "./Marp Vorlage von Rea/theme:/app/theme:ro"
      - "./Marp Vorlage von Rea/output:/app/output"
    entrypoint: ["marp"]
    command: ["input/sample.md", "--pdf", "--allow-local-files", "-o", "output/sample.pdf"]


    # Module Generator for create_module.py:
  module-generator:
    image: python:3.12-slim
    working_dir: /app

    volumes:
      - "./scripts:/app/scripts:ro"
      - "./templates:/app/templates:ro"
      - "./modules:/app/modules"
      - "./input:/app/input:ro"

    entrypoint: ["python"]
    command: ["scripts/create_modules.py"]

    stdin_open: true
    tty: true